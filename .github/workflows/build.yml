name: Build

on:
  push:
    branches:
      - main
      - 'ci/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.10.3'
  VCPKG_BASELINE: 16c71a39e5a0fc0bdb3fad03beef8f38ee00ee3b
  VCPKG_TRIPLET: x64-windows-static-md
  CURL_IMPERSONATE_VERSION: v2.0.0

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize submodules
        run: |
          git config --global core.longpaths true
          git submodule update --init --recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats qtmultimedia
          cache: true
          setup-python: false

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          # Full clone (NOT --depth 1): vcpkg.json pins a builtin-baseline,
          # which requires the historical commit to exist locally. A shallow
          # clone cannot check out that baseline ("cloned as a shallow
          # repository"). See build.ps1 Ensure-Vcpkg.
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout $env:VCPKG_BASELINE
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: build/vcpkg_installed
          key: >-
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{
            env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json',
            'vcpkg-overlay-ports/mlspp/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_BASELINE }}-

      - name: Install curl-impersonate
        shell: pwsh
        run: |
          $version = $env:CURL_IMPERSONATE_VERSION
          $archive = Join-Path $env:GITHUB_WORKSPACE 'libcurl-impersonate.tar.gz'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'curl-impersonate'
          $url = "https://github.com/lexiforest/curl-impersonate/releases/download/$version/libcurl-impersonate-$version.x86_64-win32.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          tar -xzf $archive -C $destination
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract curl-impersonate.' }
          Remove-Item $archive -Force

      - name: Configure
        shell: pwsh
        run: |
          $curlRoot = Join-Path $env:GITHUB_WORKSPACE 'curl-impersonate'
          $qtRoot = $env:QT_ROOT_DIR
          if (-not $qtRoot) { throw 'QT_ROOT_DIR was not set by install-qt-action.' }
          $qt6Dir = Join-Path $qtRoot 'lib\cmake\Qt6'
          if (-not (Test-Path (Join-Path $qt6Dir 'Qt6Config.cmake'))) {
            throw "Qt6Config.cmake not found at $qt6Dir"
          }
          # Detect the installed Visual Studio generator. GitHub-hosted
          # windows-latest images do not always ship VS 2022 (e.g. they may
          # provide VS 2026 = "Visual Studio 18 2026"), so override the
          # hardcoded "Visual Studio 17 2022" generator in CMakePresets.json.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }
          $vsArgs = @(
            '-latest', '-products', '*',
            '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          )
          $displayName = (& $vswhere @vsArgs -property displayName 2>$null | Select-Object -First 1).Trim()
          $displayVersion = (& $vswhere @vsArgs -property catalog_productDisplayVersion 2>$null | Select-Object -First 1).Trim()
          if (-not $displayName -or -not $displayVersion) {
            throw 'Unable to detect a Visual Studio installation with VC tools via vswhere.'
          }
          # CMake generator names take the form "Visual Studio <major> <year>",
          # e.g. "Visual Studio 17 2022" or "Visual Studio 18 2026". Parse the
          # year from the display name ("Visual Studio Enterprise 2026") and the
          # major version from the product display version ("18.0.0").
          $major = ($displayVersion -split '\.')[0]
          $year = if ($displayName -match '(20\d\d)') { $Matches[1] }
                  else { throw "Could not parse the Visual Studio year from display name: $displayName" }
          $generator = "Visual Studio $major $year"
          Write-Host "Using CMake generator: $generator"

          cmake `
            --preset windows `
            "-G$generator" `
            "-DQt6_DIR=$qt6Dir" `
            "-DCURL_INCLUDE_DIR=$curlRoot\include" `
            "-DCURL_LIBRARY=$curlRoot\lib\libcurl-impersonate_imp.lib" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset windows --config RelWithDebInfo --parallel

      - name: Test
        shell: pwsh
        run: |
          ctest --preset windows -C RelWithDebInfo --output-on-failure

      - name: Deploy Qt
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        run: |
          # The acheron_deploy target runs windeployqt AND copies non-Qt runtime
          # files (e.g. opus.dll, a direct exec import that windeployqt cannot
          # discover) into build/deploy/<Config>. See cmake/DeployQtRuntime.cmake.
          cmake --build --preset windows --config RelWithDebInfo --target acheron_deploy

      - name: Prepare artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        run: |
          $artifactName = 'acheron-windows'
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE $artifactName
          $deployDirectory = Join-Path $env:GITHUB_WORKSPACE 'build\deploy\RelWithDebInfo'
          $curlBinaryDirectory = Join-Path $env:GITHUB_WORKSPACE 'curl-impersonate\lib'
          if (-not (Test-Path $deployDirectory)) { throw "Deploy output was not found at: $deployDirectory" }
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          Copy-Item -Path "$deployDirectory\*" -Destination $outputDirectory -Recurse -Force
          $curlDlls = Get-ChildItem -Path $curlBinaryDirectory -Filter '*.dll' -File -ErrorAction Stop
          if ($curlDlls.Count -eq 0) { throw 'No curl-impersonate DLLs were found.' }
          Copy-Item -Path $curlDlls.FullName -Destination $outputDirectory -Force

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: acheron-windows
          path: acheron-windows
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            autoconf automake libtool perl \
            libgl1-mesa-dev libegl1-mesa libfontconfig1-dev \
            libxkbcommon-x11-0 libxkbcommon-dev libx11-xcb1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxrender1 libxi6 libsm6 libice6 libxext6 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libpulse0 \
            zlib1g-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats qtmultimedia
          cache: true
          setup-python: false

      - name: Set up vcpkg
        run: |
          vcpkgRoot="$RUNNER_TEMP/vcpkg"
          # Full clone (NOT --depth 1): vcpkg.json pins a builtin-baseline that
          # must exist locally to be checked out.
          git clone https://github.com/microsoft/vcpkg.git "$vcpkgRoot"
          git -C "$vcpkgRoot" checkout "$VCPKG_BASELINE"
          "$vcpkgRoot/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$vcpkgRoot" >> "$GITHUB_ENV"

      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: build-linux/vcpkg_installed
          key: >-
            vcpkg-${{ runner.os }}-x64-linux-${{ env.VCPKG_BASELINE }}-${{
            hashFiles('vcpkg.json', 'vcpkg-overlay-ports/mlspp/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-linux-${{ env.VCPKG_BASELINE }}-

      - name: Configure
        run: |
          qt6Dir="$QT_ROOT_DIR/lib/cmake/Qt6"
          if [ ! -f "$qt6Dir/Qt6Config.cmake" ]; then
            echo "Qt6Config.cmake not found at $qt6Dir" >&2
            exit 1
          fi
          cmake --preset linux \
            "-DQt6_DIR=$qt6Dir" \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build --preset linux --parallel

      - name: Test
        run: ctest --preset linux --output-on-failure

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: acheron-linux
          path: build-linux/acheron
          if-no-files-found: error
          retention-days: 1
