name: Release

# Publish a GitHub Release only when explicitly requested. This workflow does
# NOT run on push or PR — trigger it manually (Actions > Release > Run workflow)
# or via `gh workflow run release.yml -f version=v1.0.1`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  QT_VERSION: '6.10.3'
  VCPKG_BASELINE: 16c71a39e5a0fc0bdb3fad03beef8f38ee00ee3b
  VCPKG_TRIPLET: x64-windows-static-md
  CURL_IMPERSONATE_VERSION: v2.0.0

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize submodules
        run: |
          git config --global core.longpaths true
          git submodule update --init --recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats qtmultimedia
          cache: true
          setup-python: false

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout $env:VCPKG_BASELINE
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: build/vcpkg_installed
          key: >-
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{
            env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json',
            'vcpkg-triplets/**', 'vcpkg-overlay-ports/**', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_BASELINE }}-

      - name: Install curl-impersonate
        shell: pwsh
        run: |
          $version = $env:CURL_IMPERSONATE_VERSION
          $archive = Join-Path $env:GITHUB_WORKSPACE 'libcurl-impersonate.tar.gz'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'curl-impersonate'
          $url = "https://github.com/lexiforest/curl-impersonate/releases/download/$version/libcurl-impersonate-$version.x86_64-win32.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          tar -xzf $archive -C $destination
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract curl-impersonate.' }
          Remove-Item $archive -Force

      - name: Configure
        shell: pwsh
        run: |
          $curlRoot = Join-Path $env:GITHUB_WORKSPACE 'curl-impersonate'
          $qtRoot = $env:QT_ROOT_DIR
          if (-not $qtRoot) { throw 'QT_ROOT_DIR was not set by install-qt-action.' }
          $qt6Dir = Join-Path $qtRoot 'lib\cmake\Qt6'
          if (-not (Test-Path (Join-Path $qt6Dir 'Qt6Config.cmake'))) {
            throw "Qt6Config.cmake not found at $qt6Dir"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }
          $vsArgs = @(
            '-latest', '-products', '*',
            '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          )
          $displayName = (& $vswhere @vsArgs -property displayName 2>$null | Select-Object -First 1).Trim()
          $displayVersion = (& $vswhere @vsArgs -property catalog_productDisplayVersion 2>$null | Select-Object -First 1).Trim()
          if (-not $displayName -or -not $displayVersion) {
            throw 'Unable to detect a Visual Studio installation with VC tools via vswhere.'
          }
          $major = ($displayVersion -split '\.')[0]
          $year = if ($displayName -match '(20\d\d)') { $Matches[1] }
                  else { throw "Could not parse the Visual Studio year from display name: $displayName" }
          $generator = "Visual Studio $major $year"
          Write-Host "Using CMake generator: $generator"

          cmake `
            --preset windows `
            "-G$generator" `
            "-DQt6_DIR=$qt6Dir" `
            "-DCURL_INCLUDE_DIR=$curlRoot\include" `
            "-DCURL_LIBRARY=$curlRoot\lib\libcurl-impersonate_imp.lib" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset windows --config RelWithDebInfo --parallel

      - name: Copy runtime DLLs
        shell: pwsh
        run: |
          $exeDir = Join-Path $env:GITHUB_WORKSPACE 'build\RelWithDebInfo'
          $curlDll = Join-Path $env:GITHUB_WORKSPACE 'curl-impersonate\lib\libcurl-impersonate.dll'
          $opusDll = Join-Path $env:GITHUB_WORKSPACE 'build\vcpkg_installed\x64-windows-static-md\bin\opus.dll'
          if (-not (Test-Path $curlDll)) { throw "curl-impersonate DLL not found: $curlDll" }
          Copy-Item -Path $curlDll -Destination $exeDir -Force
          if (Test-Path $opusDll) { Copy-Item -Path $opusDll -Destination $exeDir -Force }
          Write-Host "Copied runtime DLLs into $exeDir"

      - name: Deploy Qt
        shell: pwsh
        run: |
          cmake --build --preset windows --config RelWithDebInfo --target acheron_deploy

      - name: Smoke test
        shell: pwsh
        run: |
          $deployDir = Join-Path $env:GITHUB_WORKSPACE 'build\deploy\RelWithDebInfo'
          $curlDll = Join-Path $env:GITHUB_WORKSPACE 'curl-impersonate\lib\libcurl-impersonate.dll'
          Copy-Item -Path $curlDll -Destination $deployDir -Force
          & "$env:GITHUB_WORKSPACE\scripts\windows-runtime-smoke.ps1" -DeploymentDirectory $deployDir

      - name: Package
        shell: pwsh
        run: |
          $deployDir = Join-Path $env:GITHUB_WORKSPACE 'build\deploy\RelWithDebInfo'
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'acheron-windows.zip'
          Compress-Archive -Path (Join-Path $deployDir '*') -DestinationPath $zipPath -Force
          Write-Host "Created $zipPath"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: acheron-windows
          path: acheron-windows.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            autoconf automake libtool perl zip \
            libgl1-mesa-dev libegl1 libfontconfig1-dev \
            libxkbcommon-x11-0 libxkbcommon-dev libx11-xcb1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxrender1 libxi6 libsm6 libice6 libxext6 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libpulse0 \
            zlib1g-dev libsecret-1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats qtmultimedia
          cache: true
          setup-python: false

      - name: Set up vcpkg
        run: |
          vcpkgRoot="$RUNNER_TEMP/vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "$vcpkgRoot"
          git -C "$vcpkgRoot" checkout "$VCPKG_BASELINE"
          "$vcpkgRoot/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$vcpkgRoot" >> "$GITHUB_ENV"

      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: build-linux/vcpkg_installed
          key: >-
            vcpkg-${{ runner.os }}-x64-linux-${{ env.VCPKG_BASELINE }}-${{
            hashFiles('vcpkg.json', 'vcpkg-triplets/**', 'vcpkg-overlay-ports/**',
            'CMakePresets.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-linux-${{ env.VCPKG_BASELINE }}-

      - name: Configure
        run: |
          qt6Dir="$QT_ROOT_DIR/lib/cmake/Qt6"
          if [ ! -f "$qt6Dir/Qt6Config.cmake" ]; then
            echo "Qt6Config.cmake not found at $qt6Dir" >&2
            exit 1
          fi
          cmake --preset linux \
            "-DQt6_DIR=$qt6Dir" \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build --preset linux --parallel

      - name: Test
        run: ctest --preset linux --output-on-failure

      - name: Package
        run: |
          zip -j acheron-linux.zip build-linux/acheron
          ls -lh acheron-linux.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: acheron-linux
          path: acheron-linux.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          case "${{ inputs.version }}" in
            v*) ;;
            *) echo "::error::version must start with 'v' (e.g. v1.0.1)"; exit 1 ;;
          esac

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: acheron-*
          path: ./release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" \
            --title "Acheron ${{ inputs.version }}" \
            --generate-notes \
            ./release-assets/acheron-windows.zip \
            ./release-assets/acheron-linux.zip
